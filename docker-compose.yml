services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: rolebridge-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rolebridge-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

